<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --header-bg: rgba(15, 23, 42, 0.8);
            --modal-bg: #1e293b;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        body.light-mode {
            --primary: #f8fafc;
            --secondary: #e2e8f0;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.3);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.8);
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            --header-bg: rgba(255, 255, 255, 0.9);
            --modal-bg: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-5px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 0 0 var(--accent-glow);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(0, 0, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
            }
        }

        header {
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        h1 {
            font-weight: 800;
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }

        h1:hover {
            transform: scale(1.02);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Modern Theme Toggle */
        .theme-toggle {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: var(--secondary);
            color: var(--accent);
        }

        .profile-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--accent);
            transition: transform 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.1);
        }

        .username {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            display: none;
            /* Hide on mobile by default */
        }

        @media(min-width: 600px) {
            /* .username { display: block; }  Removed since we want it always visible now per user request, or handled below */
        }

        /* Ensure username is visible by default or adjust styling if needed */
        .username {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            display: block;
            /* Force show */
        }

        /* Close Button for Modal */
        .close-modal-x {
            position: absolute;
            top: 15px;
            right: 25px;
            /* Moved away from edge */
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            z-index: 10;
        }

        .close-modal-x:hover {
            color: var(--accent);
        }

        /* Specific Select Padding for arrow space */
        select {
            padding-right: 40px !important;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .modal {
                width: 100%;
                height: 100vh;
                max-width: 100%;
                max-height: 100%;
                border-radius: 0;
                padding: 1.5rem;
                top: 0;
                transform: none !important;
                display: flex;
                flex-direction: column;
                margin: 0;
                position: fixed;
                /* Fixed to cover screen */
                overflow-y: auto;
            }

            .modal-overlay {
                padding: 0;
                align-items: flex-start;
            }

            header {
                flex-direction: column;
                gap: 15px;
                padding: 1rem;
            }

            .profile-container {
                flex-direction: column;
                gap: 5px;
                text-align: center;
            }

            .username {
                font-size: 0.8rem;
            }
        }

        /* Modern Add Button */
        .control-pill {
            display: flex;
            align-items: center;
            background: var(--secondary);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            padding: 4px;
            gap: 4px;
        }

        .add-game-btn {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
            border: none;
            width: 44px !important;
            height: 44px !important;
            min-width: 44px !important;
            min-height: 44px !important;
            padding: 0 !important;
            border-radius: 50%;
            font-weight: 600;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--accent-glow);
            font-family: inherit;
            flex-shrink: 0;
            line-height: 1;
        }

        .add-game-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }

        .btn-delete {
            background-color: rgba(239, 68, 68, 0.1) !important;
            color: #ef4444 !important;
            border: 1px solid #ef4444 !important;
            margin-right: auto;
        }

        .btn-delete:hover {
            background-color: #ef4444 !important;
            color: white !important;
        }

        /* Trophy & Platform Fixes */
        .trophy-container {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            /* Slight pill bg */
            padding: 4px 8px;
            border-radius: 12px;
        }

        .trophy-icon {
            width: 20px !important;
            height: 20px !important;
            object-fit: contain;
            display: block;
            position: static !important;
        }

        .platinum-glow {
            filter: drop-shadow(0 0 4px gold);
        }

        .add-game-btn:active {
            transform: translateY(0);
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .filter-item {
            flex: 1 1 200px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-item label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        select {
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--secondary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-family: inherit;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .game-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Improved Card */
        .game-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.6s ease backwards;
            box-shadow: var(--shadow-sm);
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }

        .game-image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 130%;
            /* Aspect Ratio 3:4 roughly */
            overflow: hidden;
        }

        .game-image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .game-card:hover img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 1.25rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
        }

        /* Badges & Logos */
        .platform-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .platform-badge img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            position: static;
            transform: none !important;
        }

        .edit-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.85);
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 2;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .game-card:hover .edit-btn {
            opacity: 1;
            transform: translateY(0);
        }

        .edit-btn:hover {
            background: var(--accent);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-Completed {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .status-Ongoing {
            background: rgba(250, 204, 21, 0.15);
            color: #facc15;
        }

        .status-Planning {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
        }

        .trophy-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .trophy-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
            position: static;
            transform: none !important;
        }

        .achievements-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--modal-bg);
            padding: 2.5rem;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.95) translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
            max-height: 90vh;
            /* Prevent modal from being taller than screen */
            overflow-y: auto;
            /* Scrollable if too tall */
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 2rem;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-cancel:hover {
            background: var(--secondary);
            color: var(--text-main);
        }

        .btn-save {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-save:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--secondary);
            color: var(--text-main);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Fixed Trophy Glow - Stronger */
        .platinum-glow {
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8)) !important;
        }

        /* Fixed Delete Modal Button Alignment */
        #deleteModal .modal-actions {
            justify-content: center;
            gap: 20px;
        }

        #deleteModal .btn-delete {
            margin-right: 0 !important;
            /* Remove the auto margin used in edit modal */
        }

        #deleteModal h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 1rem;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .control-pill {
                flex-shrink: 0;
            }

            .add-game-btn {
                width: 100%;
                justify-content: center;
            }

            .game-list {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }

            .game-image-wrapper img {
                height: 100%;
            }

            /* Reset explicit height helper */
            .game-image-wrapper {
                padding-top: 140%;
            }

            .game-title {
                font-size: 1rem;
            }

            .trophy-icon {
                width: 20px;
                height: 20px;
            }

            .platform-badge {
                padding: 4px;
            }

            .platform-badge img {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <h1 onclick="location.reload()" title="Reload Game Tracker">GameTracker</h1>
        </div>
        <div class="header-actions">
            <div class="control-pill">
                <button class="add-game-btn" onclick="openModal()" title="Add Game">+</button>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
            <div class="profile-container">
                <img class="profile-pic"
                    src="https://i.pinimg.com/474x/3b/c7/02/3bc7028f7f61516ebd33b6ab31582e78.jpg?nii=t"
                    alt="Profile Picture">
                <div class="username">CHIKKU10</div>
            </div>
        </div>
    </header>
    <div id="toast-container"></div>
    <main>
        <div class="filters">
            <div class="filter-item">
                <label for="search">Search Games</label>
                <input type="text" id="search" placeholder="Enter game name...">
            </div>
            <div class="filter-item">
                <label for="platform-filter">Platform</label>
                <select id="platform-filter">
                    <option value="">All Platforms</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="status-filter">Status</label>
                <select id="status-filter">
                    <option value="">All Status</option>
                    <option value="Completed">Completed</option>
                    <option value="Ongoing">Ongoing</option>
                    <option value="Planning">Planning</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="trophy-filter">Trophy</label>
                <select id="trophy-filter">
                    <option value="">All Trophies</option>
                    <option value="Platinum">Platinum</option>
                    <option value="Gold">Gold</option>
                    <option value="Silver">Silver</option>
                    <option value="Bronze">Bronze</option>
                    <option value="Broken">Broken</option>
                </select>
            </div>
        </div>
        <div id="game-list" class="game-list"></div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="gameModal">
        <div class="modal">
            <button type="button" class="close-modal-x" onclick="closeModal()">×</button>
            <h2 id="modalTitle">Add New Game</h2>
            <form id="gameForm">
                <input type="hidden" id="originalName"> <!-- To track name changes for updates -->
                <div class="form-group">
                    <label for="gameName">Game Name</label>
                    <input type="text" id="gameName" required placeholder="e.g. Elden Ring">
                </div>
                <div class="form-group">
                    <label for="gamePlatform">Platform</label>
                    <select id="gamePlatform">
                        <option value="">None</option>
                        <option value="Playstation">Playstation</option>
                        <option value="Xbox">Xbox</option>
                        <option value="Steam">Steam</option>
                        <option value="Epic">Epic</option>
                        <option value="Nintendo">Nintendo</option>
                        <option value="EA">EA</option>
                        <option value="Emulated">Emulated</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="gameAchievements">Achievements (e.g. 50/100)</label>
                    <input type="text" id="gameAchievements" placeholder="0/0">
                </div>
                <div class="form-group">
                    <label for="gameStatus">Status</label>
                    <select id="gameStatus">
                        <option value="Planning">Planning</option>
                        <option value="Ongoing">Ongoing</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="gameTrophy">Trophy</label>
                    <select id="gameTrophy">
                        <option value="">None</option>
                        <option value="Platinum">Platinum</option>
                        <option value="Gold">Gold</option>
                        <option value="Silver">Silver</option>
                        <option value="Bronze">Bronze</option>
                        <option value="Broken">Broken</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="gameThumbnail">Thumbnail URL</label>
                    <input type="url" id="gameThumbnail" placeholder="https://...">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-delete" id="deleteBtn" onclick="deleteGame()"
                        style="display: none;">Delete</button>
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-save">
                        <span class="loading-spinner" id="saveSpinner"></span>
                        Save Game
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal" style="z-index: 1100;">
        <div class="modal" style="max-width: 400px; text-align: center;">
            <h2 class="text-xl">Delete Game?</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Are you sure you want to delete <strong
                    id="deleteGameName"></strong>? This cannot be undone.</p>
            <div class="modal-actions" style="justify-content: center;">
                <button class="btn btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-delete" id="confirmDeleteBtn" onclick="confirmDelete()">Delete Forever</button>
            </div>
        </div>
    </div>

    <script>
        // REPLACE THIS URL WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycby8Ml-Oajha4C8-wpkDpaLwcW17zXiCZh1yeS1AJsMHF8lm71cyIrdH4pSPn-EchcGv7A/exec";

        // Theme Toggle Logic
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('theme-icon');
            if (document.body.classList.contains('light-mode')) {
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }
        }

        // Toast Notification Logic
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast`;
            toast.innerHTML = `
                <span style="font-size: 1.2rem;">${type === 'success' ? '✅' : '⚠️'}</span>
                <span>${message}</span>
            `;
            container.appendChild(toast);

            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 3000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Normalized to Lowercase Keys for Case Insensitivity
            const platformLogos = {
                "xbox": "https://th.bing.com/th/id/OIP.QYCkgA1sGtLaUmERoajEwQHaHa?rs=1&pid=ImgDetMain",
                "ea": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKkBGqjpd6320pOoTUagLzuuonCmguCEDPiA&s",
                "steam": "https://static.vecteezy.com/system/resources/previews/020/336/432/non_2x/steam-logo-steam-icon-free-free-vector.jpg",
                "epic": "https://logos-world.net/wp-content/uploads/2021/12/Epic-Games-Emblem.png",
                "emulated": "https://cdn-icons-png.flaticon.com/512/8237/8237266.png",
                "n": "https://png.pngtree.com/png-clipart/20210330/ourlarge/pngtree-pirate-game-icon-png-image_3170763.jpg", /* Generic Gamepad for N/None */
                "none": "https://png.pngtree.com/png-clipart/20210330/ourlarge/pngtree-pirate-game-icon-png-image_3170763.jpg",
                "playstation": "https://upload.wikimedia.org/wikipedia/commons/9/91/PlayStation_App_Icon.jpg",
                "nintendo": "https://i0.wp.com/mynintendonews.com/wp-content/uploads/2017/01/nintendo_switch_logo_proper.jpg?resize=930%2C620&ssl=1"
            };

            const trophyIcons = {
                "platinum": "https://d2t1xqejof9utc.cloudfront.net/screenshots/pics/0d879147d0eef059854dc4ef5dbd95b6/large.jpg",
                "gold": "https://media.istockphoto.com/id/1025281982/vector/best-simple-champion-cup-winner-trophy-award-and-victory.jpg?s=612x612&w=0&k=20&c=PmRzQNF3nf1nQm8cslQoRh7Mzp5Ljgm-7FRt9vBFvfU=",
                "silver": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEw1RKcEH6fHsMR4P4z82oT_JI2vNSdGrx7w&s",
                "bronze": "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQQsxfAmv24OdgXDbEz9dhuPCtqBjgA49F0SpS64MSZkLTh4fR1YFRJoZZ1IJ25BnqmNp4&usqp=CAU",
                "broken": "https://thumbs.dreamstime.com/z/broken-rubber-stamp-isolated-white-background-256017059.jpg"
            };

            let allGamesData = []; // Store fetched games locally

            function handleImageError(img) {
                img.onerror = null;
                // Fallback to placeholder if main image fails, or just hide if strict
                // img.src = getPlaceholderImage("Game"); 
                // Creating a colored placeholder dynamically
                img.style.display = 'none'; // Or replace
                return true;
            }
            window.handleImageError = handleImageError; // Make global

            async function fetchGames() {
                if (GAS_URL === "YOUR_WEB_APP_URL_HERE") {
                    console.warn("Please update the GAS_URL variable in the script.");
                    return;
                }

                try {
                    const response = await fetch(GAS_URL);
                    const data = await response.json();

                    if (Array.isArray(data)) {
                        allGamesData = data;
                    } else if (data.data && Array.isArray(data.data)) {
                        allGamesData = data.data;
                    } else {
                        console.warn("Unexpected data structure, attempting to use directly", data);
                        allGamesData = Array.isArray(data) ? data : [];
                    }

                    if (allGamesData.length === 0) {
                        showToast("No games found.", "warning");
                    }

                    populatePlatformFilter(allGamesData);
                    displayGames(allGamesData);

                } catch (error) {
                    console.error("Error fetching games from GAS:", error);
                    showToast("Failed to fetch games.", "error");
                }
            }

            function parseCSV(csvText) {
                // Legacy support if needed, but we are moving to JSON
                return [];
            }

            function getPlaceholderImage(gameName) {
                // Generate detailed SVG placeholder to avoid external calls & errors
                const name = (gameName || "Game").toUpperCase().slice(0, 2);
                const svg = `
                <svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#grad)"/>
                    <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="80" 
                          fill="#3b82f6" font-weight="bold" text-anchor="middle" dy=".3em" opacity="0.5">
                        ${name}
                    </text>
                </svg>`.trim();
                return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
            }

            function populatePlatformFilter(games) {
                const platforms = [...new Set(games.map(game => game.platform))];
                const filter = document.getElementById('platform-filter');
                while (filter.options.length > 1) {
                    filter.remove(1);
                }
                platforms.forEach(platform => {
                    if (!platform) return;
                    const option = document.createElement('option');
                    option.value = platform;
                    option.textContent = platform;
                    filter.appendChild(option);
                });
            }

            function displayGames(games) {
                // Sort Alphabetically by Name
                games.sort((a, b) => (a.name || "").localeCompare(b.name || ""));

                const gameList = document.getElementById('game-list');
                gameList.innerHTML = '';

                games.forEach((game, index) => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.style.animationDelay = `${index * 0.05}s`;

                    // Platform Logic
                    let platformKey = String(game.platform || "none").trim().toLowerCase();
                    if (platformKey === '' || platformKey === 'n') platformKey = 'none';
                    let finalPlatformHTML = '';
                    if (platformKey && platformLogos[platformKey]) {
                        finalPlatformHTML = `<div class="platform-badge" title="${game.platform}">
                                            <img src="${platformLogos[platformKey]}" alt="${game.platform}">
                                        </div>`;
                    }

                    // Trophy Logic (Strict + Tooltip Fix)
                    const rawTrophy = game.trophies || game.Trophies || game.Trophy || game.trophy || "None";
                    const trophyKey = String(rawTrophy).trim().toLowerCase();
                    let finalTrophyHTML = '';

                    if (trophyKey && trophyIcons[trophyKey]) {
                        const isPlatinum = trophyKey.includes('platinum');
                        const glowClass = isPlatinum ? 'platinum-glow' : '';
                        finalTrophyHTML = `<div class="trophy-container" title="${rawTrophy} Trophy" style="display: flex; align-items: center;">
                                        <img class="trophy-icon ${glowClass}" src="${trophyIcons[trophyKey]}" alt="${rawTrophy}">
                                      </div>`;
                    }

                    // Achievement Logic
                    let achContent = '';
                    let achText = String(game.achievements || "").trim();
                    const showAch = achText && achText.toLowerCase() !== 'n' && achText.toLowerCase() !== 'null' && achText !== '0';

                    if (showAch) {
                        if (!achText.includes('%') && !achText.includes('/')) {
                            achText += "%";
                        }
                        achContent = `<div class="achievements-bar-container">
                                        <span class="achievements-text">Achievement: ${achText}</span>
                                      </div>`;
                    }

                    // HTML Structure - Explicit Order
                    card.innerHTML = `
                        <button class="edit-btn" onclick="openModalWithGame(event, '${game.name.replace(/'/g, "\\'")}')">✎</button>
                        <div class="game-image-wrapper">
                            <img src="${game.thumbnail || getPlaceholderImage(game.name)}" alt="${game.name}" onerror="this.src='${getPlaceholderImage(game.name)}'">
                        </div>
                        ${finalPlatformHTML}
                        <div class="card-content">
                            <h3 class="game-title">${game.name}</h3>
                            ${achContent}
                            <div class="card-meta">
                                <span class="status-badge status-${game.status}">${game.status || 'Planning'}</span>
                                ${finalTrophyHTML}
                            </div>
                        </div>
                    `;

                    card.dataset.gameObj = JSON.stringify(game);

                    card.onclick = (e) => {
                        if (!e.target.closest('.edit-btn')) {
                            openModal(game);
                        }
                    };

                    gameList.appendChild(card);
                });
            }

            // Helper to prevent propagation if button clicked (though we replaced onclick above)
            window.openModalWithGame = function (event, gameName) {
                event.stopPropagation();
                const game = allGamesData.find(g => g.name === gameName);
                if (game) openModal(game);
            };

            document.getElementById('search').addEventListener('input', filterGames);
            document.getElementById('platform-filter').addEventListener('change', filterGames);
            document.getElementById('status-filter').addEventListener('change', filterGames);
            document.getElementById('trophy-filter').addEventListener('change', filterGames);

            function filterGames() {
                const searchTerm = document.getElementById('search').value.toLowerCase();
                const platform = document.getElementById('platform-filter').value;
                const status = document.getElementById('status-filter').value;
                const trophy = document.getElementById('trophy-filter').value.toLowerCase();

                const filteredGames = allGamesData.filter(game => {
                    const matchesSearch = String(game.name || "").toLowerCase().includes(searchTerm);
                    const matchesPlatform = !platform || game.platform === platform;
                    const matchesStatus = !status || game.status === status;
                    // Robust Trophy Check with Multiple Property Fallbacks
                    const gameTrophy = String(game.trophies || game.Trophies || game.Trophy || game.trophy || "").toLowerCase().trim();
                    const matchesTrophy = !trophy || gameTrophy === trophy;
                    return matchesSearch && matchesPlatform && matchesStatus && matchesTrophy;
                });

                displayGames(filteredGames);
            }

            // Initial Fetch
            fetchGames();
        });

        // Modal Functions
        function openModal(game = null) {
            const modal = document.getElementById('gameModal');
            const title = document.getElementById('modalTitle');
            const form = document.getElementById('gameForm');

            if (game) {
                title.textContent = "Edit Game";
                document.getElementById('originalName').value = game.name;
                document.getElementById('gameName').value = game.name;
                document.getElementById('gamePlatform').value = game.platform || "Playstation";
                document.getElementById('gameAchievements').value = game.achievements || "";
                document.getElementById('gameStatus').value = game.status || "Planning";
                // Try multiple keys for trophies in edit modal too
                document.getElementById('gameTrophy').value = game.trophies || game.Trophies || game.Trophy || game.trophy || "";
                document.getElementById('gameThumbnail').value = game.thumbnail || "";
                document.getElementById('deleteBtn').style.display = 'block'; // Show delete button
            } else {
                title.textContent = "Add New Game";
                form.reset();
                document.getElementById('originalName').value = "";
                document.getElementById('deleteBtn').style.display = 'none'; // Hide delete logic on add
            }

            modal.classList.add('active');
        }

        // PIN Logic
        function getAdminPin() {
            let pin = localStorage.getItem('gameTrackerPin');
            if (!pin) {
                pin = prompt("🔐 Security Check\nEnter your Admin PIN to verify identity:");
                if (pin) localStorage.setItem('gameTrackerPin', pin);
            }
            return pin || "";
        }

        // Delete Modal Logic
        let gameToDeleteName = "";

        function deleteGame() {
            gameToDeleteName = document.getElementById('originalName').value;
            if (!gameToDeleteName) return;

            document.getElementById('deleteGameName').textContent = gameToDeleteName;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }

        async function confirmDelete() {
            if (!gameToDeleteName) return;

            const deleteBtn = document.getElementById('confirmDeleteBtn');
            const originalText = deleteBtn.textContent;
            deleteBtn.textContent = "Deleting...";
            deleteBtn.disabled = true;

            const formData = {
                action: 'delete',
                originalName: gameToDeleteName,
                name: gameToDeleteName,
                pin: getAdminPin() // Add PIN
            };

            console.log("Sending delete request for:", gameToDeleteName, formData);

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                console.log("Delete response:", result);

                if (result.status === 'success') {
                    showToast("Game deleted successfully!");
                    closeDeleteModal();
                    closeModal(); // Close main edit modal
                    setTimeout(() => location.reload(), 1000);
                } else {
                    // Debugging: Show full object if message is missing
                    const errorMsg = result.message || JSON.stringify(result);
                    console.error("Server Result:", result);
                    showToast("Error: " + errorMsg, "error");

                    // If denied, maybe clear invalid pin
                    if (errorMsg.includes("Denied")) {
                        localStorage.removeItem('gameTrackerPin');
                    }
                }
            } catch (error) {
                console.error("Delete error:", error);
                showToast("Failed to delete. Check connection.", "error");
            } finally {
                deleteBtn.textContent = originalText;
                deleteBtn.disabled = false;
            }
        }


        function closeModal() {
            document.getElementById('gameModal').classList.remove('active');
        }

        // Form Submission
        document.getElementById('gameForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (GAS_URL === "YOUR_WEB_APP_URL_HERE") {
                showToast("Please configure the GAS_URL code!", "error");
                return;
            }

            const spinner = document.getElementById('saveSpinner');
            spinner.style.display = 'inline-block';

            const originalName = document.getElementById('originalName').value;
            const isEdit = !!originalName;

            const formData = {
                action: isEdit ? 'update' : 'add',
                originalName: originalName, // Only needed for update
                name: document.getElementById('gameName').value,
                platform: document.getElementById('gamePlatform').value,
                achievements: document.getElementById('gameAchievements').value,
                status: document.getElementById('gameStatus').value,
                trophies: document.getElementById('gameTrophy').value,
                thumbnail: document.getElementById('gameThumbnail').value,
                pin: getAdminPin()
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    showToast(result.message || "Game saved successfully!");
                    closeModal();
                    // Wait a bit to show the toast before reload?
                    // Actually, if we reload, toast disappears.
                    // Better to just refresh data without reload if possible,
                    // But simpler to reload for now.
                    // Let's delay reload 1s
                    setTimeout(() => location.reload(), 1500);
                } else {
                    showToast("Error: " + result.message, "error");
                }
            } catch (error) {
                console.error("Error saving game:", error);
                showToast("Failed to save. Check connection.", "error");
            } finally {
                spinner.style.display = 'none';
            }
        });

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered!', reg))
                    .catch(err => console.log('SW failed!', err));
            });
        }
    </script>
</body>

</html>
